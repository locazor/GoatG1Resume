resume:
  name: Resume (continue) mowing
  description: >-
    Continue the paused, unfinished mowing task from where it left off
    (mirrors the Ecovacs app's "Continue" button by sending act: r). Unlike
    lawn_mower.start_mowing, this does NOT restart the map from scratch. With
    no target, every configured GOAT is resumed.
  fields:
    device_id:
      name: Device
      description: Ecovacs device(s) to resume. Defaults to all configured GOATs.
      required: false
      selector:
        device:
          integration: ecovacs
    entity_id:
      name: Entity
      description: Lawn mower entity(ies) whose device should be resumed.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: ecovacs
