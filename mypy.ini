; Type-check configuration.
;
; Home Assistant is deliberately NOT a dev dependency (see requirements_test.txt):
; the tests stub the handful of HA symbols they need so the suite runs fast and
; without pulling in the whole of core. That means mypy sees `homeassistant.*` as
; missing imports and treats its classes as `Any`.

[mypy]
python_version = 3.13
ignore_missing_imports = True
warn_unused_configs = True
check_untyped_defs = True

; `class EcovacsResumeConfigFlow(ConfigFlow, domain=DOMAIN)` is the documented
; Home Assistant idiom, but with `homeassistant` unresolved mypy sees a subclass
; of `Any` and rejects the `domain=` class keyword against `object.__init_subclass__`.
; This is purely an artefact of HA being absent; install `homeassistant` and the
; error disappears. Scoped to this one module so nothing else is silenced.
[mypy-ecovacs_resume.config_flow]
disable_error_code = call-arg
